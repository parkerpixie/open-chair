name: Open Chair - TestFlight release

on:
  workflow_dispatch:
    inputs:
      release_action:
        description: 'Build only, or build and submit to TestFlight?'
        required: true
        type: choice
        options:
          - build_only
          - build_and_submit
        default: build_only

permissions:
  contents: read

concurrency:
  group: open-chair-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Validate and start iOS EAS release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: '1'
    steps:
      - name: Checkout the tested Open Chair beta, never the starter main branch
        uses: actions/checkout@v4
        with:
          ref: feature/open-chair-today-redesign

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Confirm Expo token is configured
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing repository Actions secret EXPO_TOKEN. Create a personal access token in Expo and add it under GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run beta quality checks
        run: |
          npm run typecheck
          npm run lint
          npm test -- --passWithNoTests --testTimeout=15000

      - name: Confirm existing Open Chair app identifier
        run: |
          node -e 'const a=require("./app.json").expo;if(a.ios.bundleIdentifier!=="com.undergrowth.openchair"||a.extra.eas.projectId!=="8d801d77-5ef9-45bc-aa16-51188735b27c")process.exit(1);console.log("Existing app bundle and Expo project verified.");'

      - name: Authenticate Expo and install EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit beta build job to EAS
        env:
          RELEASE_ACTION: ${{ inputs.release_action }}
        shell: bash
        run: |
          if [ "$RELEASE_ACTION" = "build_and_submit" ]; then
            echo "Starting iOS production-profile build; successful build will upload to TestFlight, NOT public App Store."
            eas build --platform ios --profile production --non-interactive --auto-submit --no-wait
          else
            echo "Starting iOS production-profile build ONLY, not submitting it."
            eas build --platform ios --profile production --non-interactive --no-wait
          fi

      - name: Show project build dashboard
        run: |
          echo "EAS project builds: https://expo.dev/accounts/capyqueue-systems-for-humans/projects/open-chair/builds" >> "$GITHUB_STEP_SUMMARY"
          echo "If build_and_submit was selected, monitor the successful iOS build and its TestFlight processing in App Store Connect." >> "$GITHUB_STEP_SUMMARY"
